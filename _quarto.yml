project:
  type: book
  output-dir: _book
  execute-dir: project
  resources:
    - data/
    - images/
    - assets/
    - practicals/*.qmd
    - practicals/*.Rmd
book:
  title: "R Programming for Agricultural Data Analysis"
  subtitle: "A textbook and practical companion for undergraduate and postgraduate courses (0+2 and STAT 531)"
  author: "Dr. Pratheesh P. Gopinath"
  date: today
  date-format: "D MMMM YYYY"
  cover-image: images/cover.png
  repo-url: https://github.com/KAUMELON/stat-531
  search: true
  chapters:
    - index.qmd
    - course-guide.qmd
    - part: "Module 1 · Foundations and data exchange"
      chapters:
        - 01-getting-started.qmd
        - 02-r-language.qmd
        - 03-data-import.qmd
    - part: "Module 2 · Data wrangling and cleaning"
      chapters:
        - 04-cleaning.qmd
        - 05-wrangling.qmd
    - part: "Module 3 · Data visualization"
      chapters:
        - 06-visualization.qmd
    - part: "Module 4 · Descriptive and exploratory analysis"
      chapters:
        - 07-descriptive.qmd
        - 08-eda.qmd
    - part: "Module 5 · Growth and time series"
      chapters:
        - 09-growth.qmd
        - 10-time-series.qmd
    - part: "Module 6 · Statistical analysis"
      chapters:
        - 11-inference.qmd
        - 12-anova.qmd
        - 12b-experimental-designs.qmd
        - 13-regression.qmd
    - part: "Module 7 · Reproducible research and AI-assisted coding"
      chapters:
        - 14-reporting.qmd
        - 14b-vibe-coding.qmd
    - part: "Module 8 · Exploratory analysis and probability distributions (STAT 531)"
      chapters:
        - 15-met-eda.qmd
        - 16-distributions.qmd
    - part: "Module 9 · Tests of significance (STAT 531)"
      chapters:
        - 17-large-sample.qmd
        - 18-small-sample.qmd
    - part: "Module 10 · Analysis of variance and covariance (STAT 531)"
      chapters:
        - 19-anova-mcp.qmd
        - 20-research-designs.qmd
        - 21-contrasts.qmd
        - 22-ancova.qmd
    - part: "Module 11 · Mixed models and multiple regression (STAT 531)"
      chapters:
        - 23-mixed-models.qmd
        - 24-multiple-regression.qmd
    - part: "Module 12 · Multivariate methods and non-linear models (STAT 531)"
      chapters:
        - 25-pca.qmd
        - 26-factor-analysis.qmd
        - 27-discriminant.qmd
        - 28-nonlinear.qmd
    - references.qmd
  appendices:
    - data-dictionary.qmd
    - solutions.qmd
    - glossary.qmd
bibliography: [book.bib, packages.bib]
format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    code-copy: true
    code-overflow: wrap
    highlight-style: github
    include-after-body:
      text: |
        <script type="module" src="assets/live-r.js"></script>
        <script defer src="assets/melon-tracker.js" data-book="r-agricultural-data"></script>
  pdf:
    documentclass: scrreprt
    toc: true
    number-sections: true
    keep-tex: true
  docx:
    toc: true
    number-sections: true
execute:
  echo: true
  warning: true
  message: false
  error: false
  freeze: false
knitr:
  opts_chunk:
    fig.width: 7
    fig.height: 4.5
    dpi: 144
lang: en
